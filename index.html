<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Una Vuelta al Mundo - Un planeta. Seis mundos.</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
</head>
<body>

    <main class="main-container">
        <section class="hero-section">
            <div class="subtitle-badge">
                <span class="line"></span>
                <span class="subtitle-text">UNA VUELTA AL MUNDO</span>
            </div>
            
            <h1 class="main-title">
                <span class="title-black">Un planeta.</span>
                <span class="title-terracotta">Seis mundos.</span>
            </h1>
        </section>
        <div class="navigation-bar">
            <span class="nav-label">ELIGE TU PRÓXIMO DESTINO</span>
            <span class="nav-counter">01 — 06</span>
        </div>

        <section class="continents-grid" id="continentsGrid">
            <!-- África -->
            <article class="card" data-continent="África" data-countries="54 Países" data-desc="El continente de la megafauna, desiertos infinitos, sabanas vibrantes y una riquísima herencia cultural originaria.">
                <div class="card-image-wrapper">
                    <img src="africa.avif" alt="África" class="card-img" />
                </div>
                <div class="card-meta">
                    <span class="meta-subtitle">54 PAÍSES</span>
                    <span class="meta-number">01</span>
                </div>
                <h2 class="card-title">África</h2>
            </article>

            <article class="card" data-continent="América" data-countries="35 Países" data-desc="De la Patagonia al Ártico, abarcando selvas tropicales, majestuosas cordilleras y culturas vibrantes.">
                <div class="card-image-wrapper">
                    <img src="america.avif" alt="América" class="card-img" />
                </div>
                <div class="card-meta">
                    <span class="meta-subtitle">35 PAÍSES</span>
                    <span class="meta-number">02</span>
                </div>
                <h2 class="card-title">América</h2>
            </article>
            <article class="card" data-continent="Asia" data-countries="48 Países" data-desc="Un contraste fascinante entre megalópolis ultratecnológicas, antiguas tradiciones y los picos más altos de la Tierra.">
                <div class="card-image-wrapper">
                    <img src="asia.avif" alt="Asia" class="card-img" />
                </div>
                <div class="card-meta">
                    <span class="meta-subtitle">48 PAÍSES</span>
                    <span class="meta-number">03</span>
                </div>
                <h2 class="card-title">Asia</h2>
            </article>
            <article class="card" data-continent="Europa" data-countries="44 Países" data-desc="Cuna del arte y la arquitectura clásica, rodeada de costas esmeralda, castillos históricos y ríos legendarios.">
                <div class="card-image-wrapper">
                    <img src="europa.avif" alt="Europa" class="card-img" />
                </div>
                <div class="card-meta">
                    <span class="meta-subtitle">44 PAÍSES</span>
                    <span class="meta-number">04</span>
                </div>
                <h2 class="card-title">Europa</h2>
            </article>
            <article class="card" data-continent="Oceanía" data-countries="14 Países" data-desc="Un paraíso insular dominado por arrecifes de coral, islas volcánicas y paisajes marinos inexplorados.">
                <div class="card-image-wrapper">
                    <img src="oceania.avif" alt="Oceanía" class="card-img" />
                </div>
                <div class="card-meta">
                    <span class="meta-subtitle">14 PAÍSES</span>
                    <span class="meta-number">05</span>
                </div>
                <h2 class="card-title">Oceanía</h2>
            </article>
            <article class="card" data-continent="Antártida" data-countries="El Continente Blanco" data-desc="El lugar más remoto del planeta: un desierto de hielo majestuoso, indómito y en silencio casi absoluto.">
                <div class="card-image-wrapper">
                    <img src="antartida.avif" alt="Antártida" class="card-img" />
                </div>
                <div class="card-meta">
                    <span class="meta-subtitle">EL CONTINENTE BLANCO</span>
                    <span class="meta-number">06</span>
                </div>
                <h2 class="card-title">Antártida</h2>
            </article>
        </section>

        <footer class="site-footer">
            <span class="footer-text">SI SE PUEDE 4ENVD G1</span>
        </footer>
    </main>

    <script src="funtion.js"></script>
</body>
</html>
